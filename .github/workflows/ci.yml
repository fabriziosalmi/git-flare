name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18

      - name: Rust tests
        run: cargo test --manifest-path crates/aimp-wasm/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --manifest-path crates/aimp-wasm/Cargo.toml -- -D warnings

      - name: Rebuild WASM (canonical Docker build) and verify committed pkg is identical
        run: |
          sh scripts/build-wasm.sh
          git diff --exit-code crates/aimp-wasm/pkg/

      - run: npm ci

      - name: Log-odds table is generated, not hand-edited
        run: node scripts/gen-logodds.mjs --check

      - run: npm run typecheck

      - name: Tests (inside workerd)
        run: npm test

      - name: Tests of the measurement scripts
        run: npm run test:scripts

      - name: Queue simulation self-test (local server, mock Artifacts)
        timeout-minutes: 5
        run: |
          printf 'ADMIN_KEY=%s\nAUTH_SECRET=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" > .dev.vars.dev
          ADMIN=$(grep '^ADMIN_KEY=' .dev.vars.dev | cut -d= -f2-)
          npx wrangler dev --env dev --port 8787 > /tmp/wrangler-dev.log 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8787/api/health > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then echo "the local server did not start"; tail -20 /tmp/wrangler-dev.log; exit 1; fi
          GF_ADMIN_KEY="$ADMIN" node scripts/queue-sim.mjs --selftest

      - name: Deploy dry-run for every environment
        run: |
          npx wrangler deploy --dry-run --outdir /tmp/dry-prod
          npx wrangler deploy --dry-run --outdir /tmp/dry-staging --env staging
          npx wrangler deploy --dry-run --outdir /tmp/dry-dev --env dev
